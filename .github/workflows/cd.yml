name: CD - Deploy to Coolify

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  deploy-backend:
    name: Trigger Coolify Deployment (Backend)
    runs-on: ubuntu-latest
    if: hashFiles('backend/package.json') != ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Final Pre-flight Verification
        run: |
          npm run lint
          npm test

      - name: Ping Coolify Deploy Webhook
        run: |
          echo "Triggering Coolify rolling update..."
          curl -f -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}"

  # Placeholder — becomes active once frontend/package.json exists
  deploy-frontend:
    name: Trigger Coolify Deployment (Frontend)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Final Pre-flight Verification
        run: |
          npm run lint
          npm test

      - name: Ping Coolify Deploy Webhook
        run: |
          echo "Triggering Coolify rolling update..."
          curl -f -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_FRONTEND }}"