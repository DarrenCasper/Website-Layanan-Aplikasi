name: CI & AI Code Review

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  # Job 1: Deterministic Linting & Unit Testing (backend)
  test-and-lint:
    name: Lint & Test Suite (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test -- --coverage

  # Job 1b: Deterministic Linting & Unit Testing (frontend)
  # Placeholder — becomes active once frontend/package.json exists
  frontend-test-and-lint:
    name: Lint & Test Suite (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        if: hashFiles('frontend/package.json') != ''
        run: npm ci

      - name: Run Linter (ESLint)
        if: hashFiles('frontend/package.json') != ''
        run: npm run lint

      - name: Run Unit & Integration Tests
        if: hashFiles('frontend/package.json') != ''
        run: npm test -- --coverage

  # Job 2: AI Code Review (Logic bugs, edge cases, security)
  ai-review:
    name: AI PR Reviewer
    runs-on: ubuntu-latest
    needs: test-and-lint # Runs concurrently or after tests pass
    permissions:
      contents: read
      pull-requests: write # Required so the AI can post comments on the PR
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run AI Code Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          openai_light_model: "gpt-4o-mini"
          openai_heavy_model: "gpt-4o-mini"
          system_message: |
            You are a senior code reviewer. 
            Do NOT comment on trivial formatting or syntax errors that linters catch. 
            Focus specifically on:
            - Unhandled edge cases and runtime exceptions.
            - Logic errors, race conditions, or unhandled async/await.
            - Potential security risks (SQL injection, unsafe input, auth bypass).
            Provide concise explanations and actionable code diff suggestions.